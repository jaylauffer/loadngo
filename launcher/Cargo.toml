[package]
name = "loadngo-launcher"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "launcher"
path = "src/lib.rs"

[[bin]]
name = "launcher"
path = "src/main.rs"

[dependencies]
loadngo-host-core = { path = "../host-core" }
loadngo-host-desktop = { path = "../host-desktop" }
serde.workspace = true
serde_json.workspace = true
ui-core = { path = "../ui-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
