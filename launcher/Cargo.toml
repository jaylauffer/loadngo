[package]
name = "loadngo-launcher"
version = "0.1.3"
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "launcher"
path = "src/lib.rs"

[[bin]]
name = "launcher"
path = "src/main.rs"

[dependencies]
loadngo-host-core = { path = "../host-core" }
loadngo-host-desktop = { path = "../host-desktop" }
loadngo-vault = { path = "../vault" }
serde.workspace = true
serde_json.workspace = true
ui-core = { path = "../ui-core" }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
loadngo-vault = { path = "../vault", features = ["test-random"] }
tempfile = "3"
