[package]
name = "loadngo-gpt-oss"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "OpenAI's gpt-oss models from their GGUF files: the o200k tokenizer, the harmony chat format and the forward pass, written from the published architecture."

[dependencies]
blake3.workspace = true
loadngo-weights = { path = "../weights" }
# The chat tool: file, archive, memory and web tools, and the archive signing key.
loadngo-inference = { path = "../inference", features = ["agent"] }
data = { path = "../data" }
loadngo-line-editor = { path = "../line-editor" }
regex-syntax = "0.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# The server (`gpt_oss_serve`): its proactor, peer credentials and signal pipe.
libc = "0.2"
loadngo-proactor = { path = "../proactor" }

[target.'cfg(target_os = "macos")'.dependencies]
loadngo-metal-compute = { path = "../metal-compute" }

[dev-dependencies]
serde_json.workspace = true
