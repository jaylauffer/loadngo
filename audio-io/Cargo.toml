[package]
name = "loadngo-audio-io"
description = "Foundational live audio-input tooling: pitch detection plus (desktop) device enumeration and low-latency input-to-output monitoring"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true

# Live device enumeration and full-duplex monitoring need real hardware I/O.
# Desktop targets only; Android/iOS live-input capture is a different
# problem no caller has asked for (see `docs/AUDIO_IO.md`).
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
rtrb.workspace = true
loadngo-proactor = { path = "../proactor" }

# macOS talks to CoreAudio's HAL directly (`src/backend/coreaudio`). Not a new
# crate for the workspace: `cpal` (still used by `rodio` for playback) already
# builds `coreaudio-sys` with `core_audio`.
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = { version = "0.2", default-features = false, features = ["core_audio"] }

# Linux talks to ALSA through `libasound` directly (`src/backend/alsa`), with
# bindings declared in that module -- no crate, and nothing for a non-Linux
# host to install, so `cargo check --target aarch64-unknown-linux-gnu` works
# from a Mac.

# Windows stays on `cpal` until a WASAPI backend lands, which waits for a real
# Windows machine to verify it on (`docs/AUDIO_BACKENDS.md`).
[target.'cfg(target_os = "windows")'.dependencies]
cpal.workspace = true

[dev-dependencies]
