[package]
name = "loadngo-animation"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Motion matching over captured motion: skeletons, BVH import, retargeting, the motion database, its search and runtime, for native targets and wasm32; see docs/ANIMATION.md"

