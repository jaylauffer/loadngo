[package]
name = "loadngo-vault"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A password vault: each password it makes is a prime number, and the passwords are kept in one file sealed under a master password."

[lib]
name = "loadngo_vault"
path = "src/lib.rs"

[features]
# A random source that repeats, for the tests of what is built on the vault.
# Never for making a secret.
test-random = []

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
