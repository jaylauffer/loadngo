[package]
name = "loadngo-host-desktop"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Desktop playback on loadngo's own CoreAudio/ALSA output seam instead of
# rodio/cpal. Off by default on purpose: macOS and Linux are where audio
# currently works best, so the replacement becomes the default only once it
# has been measured against the incumbent on real hardware. Both paths
# implement the same `imp` contract, so enabling this swaps the backend
# without any caller changing.
native-desktop-audio = []
# The read-only Archive CAS browser is a desktop tool, not part of the host.
# Its dependencies sit behind this feature so the games that depend on this
# crate never compile the CAS, its signature code, or pqcrypto's C sources.
archive-cas-browser = ["dep:anyhow", "dep:data", "dep:loadngo-pq-crypto", "dep:serde_json"]
# Native PDF page rendering for archive_cas_browser's file preview, via
# pdfium (Google's PDF engine) through FFI -- an explicit, temporary
# stop-gap until loadngo has its own native Rust PDF renderer. See
# docs/PDF_RENDERING.md. Off by default and independent of every game: no
# sng-* game enables this, and it is a Cargo feature specifically so that
# stays true without anyone having to remember it.
pdf-preview = ["dep:pdfium-render"]

[[bin]]
name = "archive_cas_browser"
required-features = ["archive-cas-browser"]

[dependencies]
anyhow = { workspace = true, optional = true }
data = { path = "../data", optional = true }
image.workspace = true
loadngo-camera = { path = "../camera" }
loadngo-host-core = { path = "../host-core" }
loadngo-persistence = { path = "../persistence" }
loadngo-pq-crypto = { path = "../pq-crypto", optional = true }
loadngo-renderer = { path = "../renderer" }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest"], optional = true }
ron.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
ui-core = { path = "../ui-core" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "ios", target_os = "linux", target_os = "windows"))'.dependencies]
futures = "0.3"

[target.'cfg(all(not(target_os = "android"), not(target_os = "netbsd"), not(target_os = "ios")))'.dependencies]
# `lewton` + `loadngo-audio-io` are the replacement for rodio/cpal here: the
# same decoder the Android and iOS backends use, feeding the CoreAudio/ALSA
# output seam this workspace already owns and hardware-verified. rodio stays
# alongside them until the replacement is proven on both macOS and Linux --
# these are the platforms where audio currently works best, and swapping them
# in one step would open a long window where the only way to find a
# regression is by ear.
lewton = "0.10"
loadngo-audio-io = { path = "../audio-io" }
rodio = { version = "0.17", features = ["vorbis"] }

[target.'cfg(target_os = "macos")'.dependencies]
loadngo-gfx-metal = { path = "../gfx-metal" }
loadngo-proactor = { path = "../proactor" }
objc2 = "0.6.4"
objc2-game-controller = { version = "0.3.2", default-features = false, features = [
    "std",
    "GCController",
    "GCExtendedGamepad",
    "GCPhysicalInputProfile",
    "GCControllerElement",
    "GCControllerDirectionPad",
    "GCControllerAxisInput",
    "GCControllerButtonInput",
] }

[target.'cfg(target_os = "android")'.dependencies]
fontdue = "0.9.3"
jni = "0.21.1"
libc = "0.2"
lewton = "0.10"
loadngo-gfx-gles = { path = "../gfx-gles" }
loadngo-proactor = { path = "../proactor" }
ndk = { version = "0.8", default-features = false }
ndk-context = "0.1"
ndk-sys = "0.5"

[target.'cfg(target_os = "ios")'.dependencies]
# Audio playback is loadngo's own: a RemoteIO AudioUnit fed by `lewton`,
# rather than rodio/cpal. `audio_unit` is where RemoteIO lives, and on iOS
# its symbols ship inside the AudioToolbox framework.
coreaudio-sys = { version = "0.2", default-features = false, features = [
    "audio_toolbox",
    "audio_unit",
] }
lewton = "0.10"
loadngo-gfx-metal = { path = "../gfx-metal" }
loadngo-proactor = { path = "../proactor" }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }
objc2-ui-kit = { version = "0.3.2", features = ["UIGestureRecognizer", "UILongPressGestureRecognizer", "UIView", "UIWindow"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
fontdue = "0.9.3"
libc = "0.2"
loadngo-gfx-gles = { path = "../gfx-gles" }
loadngo-proactor = { path = "../proactor" }
softbuffer = "0.4"
winit = { version = "0.30", default-features = false, features = ["wayland", "x11", "rwh_06"] }

[target.'cfg(target_os = "netbsd")'.dependencies]
libc = "0.2"
loadngo-proactor = { path = "../proactor" }

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3"
fontdue = "0.9.3"
loadngo-gfx-dx12 = { path = "../gfx-dx12" }
loadngo-proactor = { path = "../proactor" }
softbuffer = "0.4"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
windows.workspace = true
