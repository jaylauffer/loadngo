[package]
name = "loadngo-proactor"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
libc = "0.2"
# See the linux block's identical comment on socket2 below -- same reason,
# used by KqueuePort's IoPort impl for the same sockaddr conversions.
socket2 = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
io-uring = "0.7"
# Used only for its sockaddr_storage <-> std::net::SocketAddr conversion
# (IoPort's accept/connect/recv_from/send_to) -- correct cross-platform
# sockaddr packing (byte order, BSD's extra sin_len field, etc.) is easy
# to get subtly wrong hand-rolled, and socket2 is the standard, minimal,
# well-tested crate for exactly this.
socket2 = "0.5"

[target.'cfg(windows)'.dependencies]
windows.workspace = true
# Deliberately NOT socket2 here, unlike the Unix targets above: socket2's
# Windows backend is built on the `windows-sys` crate, not `windows` (used
# everywhere else in this file for IOCP itself) -- same-named types
# (SOCKADDR_STORAGE, etc.) from the two crates are structurally identical
# but not the same Rust type, so they can't be passed to each other
# without casting across crates. Simpler and less fragile to hand-roll
# the small amount of sockaddr conversion needed, consistently against
# the one crate already in use, than to mix the two.

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dev-dependencies]
# Only exercised by tests/loom_pending_ops_pattern.rs, and only under
# `RUSTFLAGS="--cfg loom" cargo test --release --test
# loom_pending_ops_pattern` -- with no `loom` cfg set (the normal `cargo
# test`/CI path), that whole file compiles to nothing. See that file's
# module doc for why this models the ring-lock/pending-ops/wake pattern
# rather than driving IoUringPort's real io_uring syscalls directly.
loom = "0.7"
