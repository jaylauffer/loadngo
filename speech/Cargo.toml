[package]
name = "loadngo-speech"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "On-device speech recognition and synthesis (Apple Speech and AVFAudio on macOS), for voice-driven local models"

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
block2 = "0.6.2"

[[bin]]
name = "speech_probe"
path = "src/bin/speech_probe.rs"
