name: CI

# Every platform runs on GitHub-hosted runners (2026-10-06). loadngo is
# public, so the minutes are free; no lab machine has to be on for CI, and no
# pull request from a fork runs code on lab hardware. Until then Linux ran on
# the Pis (dolores, agnes), macOS on the Mac mini and Windows on acerj, which
# was often off and left Windows jobs queued for days. Real-device checks on
# the Pis and phones are done by hand, not here.
#
# loadngo's workspace has a path dependency on ../qcoin/qcoin-types, so qcoin
# is checked out beside loadngo at QCOIN_REV. Cargo.lock records qcoin-types'
# dependencies, so a pin and a lock that disagree fail under --locked: move
# QCOIN_REV when the lock is refreshed for a newer qcoin, in the same commit.
# kimi-k3-in-rust's CI reads QCOIN_REV from this file, so keep the line's
# shape (`  QCOIN_REV: <40 hex digits>`).
#
# Per-platform excludes: Cargo has no way to drop a workspace member by
# target, and `--workspace` compiles every member on every host. Metal is
# macOS/iOS-only; DX12 and the win32 GUI are Windows-only. gui and gui-win32 do
# not compile against the current `windows` crate (imports that crate no
# longer exports, and a `gui_win32::` path inside gui-win32's own sources), a
# repair of their own; `task` depends on `gui`, and `--exclude` only drops a
# crate from the lint list, not from the build of a crate that depends on it,
# so it is out on Windows too. proactor-harness is dev-only criterion/loom
# tooling, out everywhere for build time; run its benches and loom tests by
# hand (proactor-harness/README.md).

# paths-ignore: a push or PR that changes only documentation runs nothing.
on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QCOIN_REV: 4320770faf274d5b6e6b08d007add65ec433d5a1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing must not hide what the others report.
      fail-fast: false
      matrix:
        include:
          # aarch64 Linux stands in for the lab Pis; x86-64 Linux was never
          # covered by the self-hosted runners.
          - os: ubuntu-24.04-arm
            excludes: --exclude loadngo-gfx-metal --exclude loadngo-gfx-dx12 --exclude gui-win32 --exclude proactor-harness
          - os: ubuntu-latest
            excludes: --exclude loadngo-gfx-metal --exclude loadngo-gfx-dx12 --exclude gui-win32 --exclude proactor-harness
          # Metal is in: the only host that can compile it.
          - os: macos-latest
            excludes: --exclude loadngo-gfx-dx12 --exclude gui-win32 --exclude proactor-harness
          # DX12 is in: the only host that can build it.
          - os: windows-latest
            excludes: --exclude loadngo-gfx-metal --exclude gui --exclude gui-win32 --exclude task --exclude proactor-harness
    steps:
      - name: Allow long paths in git
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: System libraries
        # alsa-sys and wayland-sys (softbuffer's Wayland client) find their
        # libraries with pkg-config at build time; host-desktop's harness
        # binaries link EGL and GLESv2.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libwayland-dev libegl-dev libgles-dev

      - uses: actions/checkout@v4
        with:
          path: loadngo

      - uses: actions/checkout@v4
        with:
          repository: jaylauffer/qcoin
          ref: ${{ env.QCOIN_REV }}
          path: qcoin

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: iOS target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: loadngo

      - name: cargo fmt --check
        working-directory: loadngo
        run: cargo fmt --check

      - name: cargo clippy (warnings are errors)
        working-directory: loadngo
        run: cargo clippy --locked --workspace --all-targets --all-features ${{ matrix.excludes }} -- -D warnings

      - name: cargo test
        working-directory: loadngo
        # --no-fail-fast: report every failing crate in one run.
        run: cargo test --locked --no-fail-fast --workspace ${{ matrix.excludes }}

      # Compile-only, and `check` rather than `clippy -D warnings`: the iOS
      # target carries pre-existing lint debt (deprecated `msg_send_id`, dead
      # code in gfx-metal). No signing is involved, so a lapsed provisioning
      # profile can never break CI; this catches the regression class that was
      # unguarded when the iOS audio backend landed.
      - name: cargo check (iOS target, compile-only)
        if: runner.os == 'macOS'
        working-directory: loadngo
        run: cargo check --locked -p loadngo-host-desktop --target aarch64-apple-ios --all-targets
