[package]
name = "loadngo-inference"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bounded local inference conversations, cooperative generation, and UTF-8 streaming"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Unicode character classes for byte-level BPE pre-split patterns (`bpe`).
regex-syntax = "0.8"
# `cas` feature: tools over a signed Archive CAS snapshot (pulls in data + PQ crypto).
data = { path = "../data", optional = true }
# `web` feature: web_search / web_fetch tools (the only tools that leave the machine).
ureq = { version = "2.12", optional = true }
url = { version = "2.5", optional = true }
# `work` feature: editing, building and reviewing tools (`edit_tools`, `work_tools`).
blake3 = { workspace = true, optional = true }
loadngo-proactor = { path = "../proactor", optional = true }
# `agent` feature: the shared chat loop (`agent`), with every tool above.
chrono = { workspace = true, optional = true }

[features]
cas = ["dep:data"]
web = ["dep:ureq", "dep:url"]
work = ["dep:blake3", "dep:loadngo-proactor"]
agent = ["cas", "web", "work", "dep:chrono"]

[dev-dependencies]
tempfile = "3"
