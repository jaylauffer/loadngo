resolver = "2"

[workspace.package]
edition = "2021"
authors = ["loadngo maintainers"]
license = "BSD-3-Clause"

[workspace.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Networking_WinSock",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "implement",
] }
windows-core = "0.58"
sha2 = "0.10"
blake3 = "1"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = "0.4"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg"] }
hex = "0.4"
getrandom = "0.2"
cpal = "0.15"
rtrb = "0.3"
pqcrypto-dilithium = "0.5"
pqcrypto-falcon = "0.4"
pqcrypto-traits = "0.3"
# ML-DSA-65 (FIPS 204) in pure Rust: nothing that signs or verifies links a C cryptography library for it.
# The repository's own copy of fips204 0.5.0 (pq-crypto/vendor/fips204), whose transforms and multiplications use
# the processor's vector instructions; pq-crypto's cross-checks are rerun whenever it changes.
fips204 = { path = "pq-crypto/vendor/fips204", default-features = false, features = ["ml-dsa-65", "default-rng"] }
zeroize = { version = "1", features = ["alloc"] }
loadngo-pq-crypto = { path = "pq-crypto" }
loadngo-anchor = { path = "anchor" }

# The signature code (the fips204 copy) is built optimised in debug and test builds too. Unoptimised, one
# ML-DSA-87 key round trip needs about 1 MB of stack, which is all a Windows main thread has (its documentation
# test overflowed there, CI run 45334063481), and ML-DSA-65's key generation 0.5 MB; optimised, 0.48 MB and
# 0.18 MB, and its own tests run in 8 s where they took 41 s. Measured: pq-crypto/vendor/fips204/VENDORED.md, "Stack".
[profile.dev.package.fips204]
opt-level = 3
