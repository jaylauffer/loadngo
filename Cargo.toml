    "proactor-harness",
    "localization",
    "audio-io",
    "camera",
    "weights",
    "gpt-oss",
    "decider",
    "line-editor",
    "text-shaping",
    "inference",
    "coreml",
    "metal-compute",
    "speech",
    "thermal",
    "system-stats",
