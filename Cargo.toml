    "touch",
    "data",
    "pq-auth",
    "proactor",
    "network",
    "gui",
    "host-desktop",
    "host-core",
    "renderer",
    "ui-core",
    "persistence",
    "localization",
    "audio-io",
    "camera",
    "weights",
    "gpt-oss",
    "line-editor",
    "text-shaping",
    "inference",
    "coreml",
    "metal-compute",
    "speech",
    "thermal",
    "system-stats",
    "pq-crypto",
    "pq-crypto/vendor/fips204",
    "anchor",
    "code-editor",
    "terminal",
    "game-menu",
    "bitmap-editor",
    "animation",
    "animation-build",
    "launcher",
